name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-js:
    name: Test JavaScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install
        working-directory: packages/js

      - name: Type check
        run: pnpm typecheck
        working-directory: packages/js

      - name: Build
        run: pnpm build
        working-directory: packages/js

      - name: Test
        run: pnpm test
        working-directory: packages/js
        continue-on-error: true  # Tests not implemented yet

  test-python:
    name: Test Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: packages/python

      - name: Type check
        run: mypy src/echostash
        working-directory: packages/python
        continue-on-error: true  # Strict mode may have issues

      - name: Lint
        run: ruff check src/echostash
        working-directory: packages/python

      - name: Test
        run: pytest
        working-directory: packages/python
        continue-on-error: true  # Tests not implemented yet
